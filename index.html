<style>

body{background:#efe3c8;overflow-x:hidden}
.page{position:relative;width:100%;max-width:1920px;margin:0 auto}
.page img{width:100%;height:auto;display:block}
.hotspot{position:absolute;display:block;z-index:20}

/* Main Book Betty button */

.menu-link{left:3%;top:68.2%;width:10.8%;height:4.2%}

/* Email in contact card */

/* Real photographs of Betty, placed over the original homepage artwork. */

.page .betty-hero{left:49%;top:0;width:51%;height:51.25%;object-position:50% 50%;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 14%);mask-image:linear-gradient(to right,transparent 0%,#000 14%)}

.instagram-top,.facebook-top{color:#fff;background:#233a2ec4;border-radius:24%;padding:.25%;height:auto;aspect-ratio:1}
.hotspot svg{width:100%;height:100%;display:block}
.hotspot:focus-visible{outline:3px solid #cc3025;outline-offset:3px}

.email-contact svg{width:10%;height:auto;flex-shrink:0;color:#690d07}
