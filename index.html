<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reci-Oh Pizza</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#efe3c8;
overflow-x:hidden;
}

.page{
position:relative;
width:100%;
}

.page img{
width:100%;
display:block;
height:auto;
}

/* BOOK BETTY BUTTON */
.book-betty{
position:absolute;
left:4%;
top:42%;
width:180px;
height:60px;
z-index:10;
display:block;
}

/* GET IN TOUCH BUTTON */
.contact-button{
position:absolute;
right:8%;
bottom:7%;
width:280px;
height:80px;
z-index:10;
display:block;
}

/* INSTAGRAM ICON */
.instagram-link{
position:absolute;
right:7%;
top:1%;
width:50px;
height:50px;
z-index:10;
display:block;
}

/* FACEBOOK ICON */
.facebook-link{
position:absolute;
right:2%;
top:1%;
width:50px;
height:50px;
z-index:10;
display:block;
}

@media(max-width:900px){

.book-betty{
width:120px;
height:45px;
top:39%;
}

.contact-button{
width:180px;
height:60px;
right:5%;
bottom:5%;
}

.instagram-link,
.facebook-link{
width:35px;
height:35px;
}

}

</style>
</head>

<body>

<div class="page">

<img src="recioh-homepage.png" alt="Reci-Oh Pizza">

<a class="book-betty"
href="mailto:reciohpizza@gmail.com?subject=Booking%20Betty">
</a>

<a class="contact-button"
href="mailto:reciohpizza@gmail.com?subject=Booking%20Betty">
</a>

<a class="instagram-link"
href="https://instagram.com/reciohpizza"
target="_blank">
</a>

<a class="facebook-link"
href="https://facebook.com"
target="_blank">
</a>

</div>

</body>
</html>
