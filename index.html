<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reci-Oh Pizza</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #efe2c4;
      font-family: Arial, sans-serif;
    }

    .site-wrap {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #efe2c4;
    }

    .homepage-image {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (min-width: 1600px) {
      .homepage-image {
        max-width: 1600px;
      }
    }
  </style>
</head>
<body>
  <main class="site-wrap">
    <img
      class="homepage-image"
      src="recioh-homepage.png"
      alt="Reci-Oh Pizza homepage"
    />
  </main>
</body>
</html>
