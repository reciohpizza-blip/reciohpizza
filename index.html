<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reci-Oh Pizza</title>

<meta name="description" content="Reci-Oh Pizza - artisan Neapolitan pizza from Betty, our 1974 Commer PB van. Available for weddings, parties, markets and private hire.">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #efe3c8;
  overflow-x: hidden;
}

.page {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
}

.page img {
  width: 100%;
  height: auto;
  display: block;
}

.hotspot {
  position: absolute;
  display: block;
  z-index: 10;
}

/* Main Book Betty button */
.book-main {
  left: 8.9%;
  top: 45.5%;
  width: 12.8%;
  height: 5.3%;
}

/* See The Menu */
.menu-link {
  left: 3.4%;
  top: 69%;
  width: 10.2%;
  height: 4.3%;
}

/* Meet Betty */
.meet-betty {
  left: 31.3%;
  top: 78.1%;
  width: 9.3%;
  height: 4.3%;
}

/* Vibe Get In Touch */
.vibe-contact {
  left: 56.2%;
  top: 77.9%;
  width: 10.6%;
  height: 4.4%;
}

/* Main contact box button */
.main-contact {
  right: 8.3%;
  top: 64.7%;
  width: 13.2%;
  height: 5.8%;
}

/* Instagram top icon */
.instagram-top {
  right: 7.1%;
  top: 2.4%;
  width: 3.4%;
  height: 5.4%;
}

/* Facebook top icon */
.facebook-top {
  right: 2.6%;
  top: 2.4%;
  width: 3.4%;
  height: 5.4%;
}

/* Instagram in contact card */
.instagram-contact {
  right: 12.4%;
  top: 72.7%;
  width: 9.5%;
  height: 3.5%;
}

/* Email in contact card */
.email-contact {
  right: 7.2%;
  top: 78%;
  width: 15%;
  height: 3.5%;
}

@media (max-width: 768px) {
  .page {
    width: 100%;
  }

  .book-main {
    left: 8.5%;
    top: 45.2%;
    width: 15%;
    height: 5.6%;
  }

  .menu-link {
    left: 2.8%;
    top: 68.3%;
    width: 13%;
    height: 5%;
  }

  .meet-betty {
    left: 31%;
    top: 77.5%;
    width: 12.5%;
    height: 5%;
  }

  .vibe-contact {
    left: 55.5%;
    top: 77.4%;
    width: 13.5%;
    height: 5%;
  }

  .main-contact {
    right: 7%;
    top: 64%;
    width: 17%;
    height: 6.5%;
  }

  .instagram-top,
  .facebook-top {
    top: 2%;
    width: 5%;
    height: 5.5%;
  }

  .instagram-top {
    right: 8.5%;
  }

  .facebook-top {
    right: 2.5%;
  }
}
</style>
</head>

<body>

<main class="page">
  <img src="recioh-homepage.png" alt="Reci-Oh Pizza homepage">

  <a class="hotspot book-main" href="mailto:reciohpizza@gmail.com?subject=Booking%20Betty" aria-label="Book Betty"></a>
  <a class="hotspot menu-link" href="mailto:reciohpizza@gmail.com?subject=Pizza%20Menu" aria-label="Ask for the menu"></a>
  <a class="hotspot meet-betty" href="mailto:reciohpizza@gmail.com?subject=Meet%20Betty" aria-label="Meet Betty"></a>
  <a class="hotspot vibe-contact" href="mailto:reciohpizza@gmail.com?subject=Private%20Hire%20Booking" aria-label="Private hire booking"></a>
  <a class="hotspot main-contact" href="mailto:reciohpizza@gmail.com?subject=Booking%20Betty" aria-label="Get in touch"></a>

  <a class="hotspot instagram-top" href="https://www.instagram.com/reciohpizza/" target="_blank" rel="noopener" aria-label="Instagram"></a>
  <a class="hotspot facebook-top" href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook"></a>

  <a class="hotspot instagram-contact" href="https://www.instagram.com/reciohpizza/" target="_blank" rel="noopener" aria-label="Instagram contact"></a>
  <a class="hotspot email-contact" href="mailto:reciohpizza@gmail.com?subject=Booking%20Betty" aria-label="Email Reci-Oh Pizza"></a>
</main>

</html>
